# Fly.io frontend app config. Deploy with:
#   flyctl launch --no-deploy --copy-config --name <your-web-name>
#   flyctl deploy -c fly.frontend.toml -a <your-web-name> \
#     --build-arg VITE_API_BASE=https://<your-api-name>.fly.dev
#
# The frontend is served by nginx; set VITE_API_BASE at build time to
# point at the backend's public URL. Set the menu-button URL in
# @BotFather to https://<your-web-name>.fly.dev once deployed.

app = "salon-miniapp-web"
primary_region = "fra"

[build]
  dockerfile = "frontend/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
