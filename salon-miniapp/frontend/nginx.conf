server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: every route unknown to nginx is served by index.html
  # so that react-router handles it client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Forward API requests to the backend when frontend and backend are
  # deployed as separate services, use `VITE_API_BASE` to point directly
  # at the backend host.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /healthz {
    proxy_pass http://backend:8000;
  }
}
